[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "flightops"
version = "0.1.0"
description = "Cost-safe lakehouse over live flight telemetry, with a fully local dev and CI path."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "JohnNessime" }]
keywords = ["aws", "lakehouse", "dbt", "duckdb", "athena", "terraform", "data-engineering"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
]
dependencies = [
  "requests>=2.32",
  "pyarrow>=17.0",
]

[project.optional-dependencies]
# Local transformation layer: DuckDB adapter only. No AWS credentials required.
local = [
  "duckdb>=1.1",
  "dbt-core>=1.8",
  "dbt-duckdb>=1.8",
]
# AWS-facing extras. Deliberately separate so CI never installs them.
aws = [
  "boto3>=1.35",
  "dbt-athena-community>=1.8",
]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "responses>=0.25",
  "ruff>=0.6",
  "pre-commit>=3.8",
  "checkov>=3.2",
]

[project.scripts]
flightops = "flightops.cli:main"

[project.urls]
Homepage = "https://github.com/JohnNessime/flightops-lakehouse"
Source = "https://github.com/JohnNessime/flightops-lakehouse"

[tool.hatch.build.targets.wheel]
packages = ["src/flightops"]

# ---------------------------------------------------------------------------
# Ruff — lint and format. Must pass clean in CI.
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["dbt/target", "dbt/dbt_packages", ".venv"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "UP",   # pyupgrade
  "ANN",  # flake8-annotations — type hints are a contract requirement
  "S",    # flake8-bandit
  "T20",  # flake8-print — logging only, never print
  "RUF",
]
ignore = [
  "ANN401",  # allow typing.Any where a public API genuinely accepts it
]

[tool.ruff.lint.per-file-ignores]
# Tests may assert, and need no annotations on fixtures.
"tests/**/*.py" = ["S101", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Pytest — offline only. No network, no AWS.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
  "slow: deselect with '-m \"not slow\"'",
]

[tool.coverage.run]
source = ["src/flightops"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
